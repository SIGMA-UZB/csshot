    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #0d1117; color: #ffffff; padding-bottom: 75px; }

    .tab-content { display: none; padding: 14px; }

    .section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #8b949e; display: flex; justify-content: space-between; align-items: center; }

    /* Cases Grid */
    .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 220px; overflow-y: auto; background: #161b22; padding: 10px; border-radius: 12px; border: 1px solid #30363d; }

    .case-card.active { border-color: #58a6ff; background: #282e33; }
    .case-icon { width: 45px; height: 45px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 28px; background: #0d1117; border-radius: 8px; border: 1px solid #30363d; }
    .case-card .name { font-size: 11px; font-weight: bold; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .case-card .price { font-size: 11px; color: #f1e05a; font-weight: bold; margin-top: 2px; }

    .item-card .item-icon { font-size: 24px; margin-bottom: 2px; }
